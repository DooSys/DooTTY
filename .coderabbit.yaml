# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: fr-FR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Inclut les PR dépendantes ciblant une branche de travail ; main reste inclus.
    base_branches:
      - "^fix/.*$"
      - "^feat/.*$"
    auto_incremental_review: true
  path_instructions:
    - path: "src-tauri/src/**/*.rs"
      instructions: |
        Prioriser les régressions fonctionnelles et de sécurité : gestion des
        erreurs, appels Win32/FFI, exécution des processus, validation des arguments
        et chemins, nettoyage des sessions ConPTY, threads et handles.
        Préserver les préférences et l'isolation du mode portable. Les actions WSL
        utilisent des arguments séparés, sans shell ni élévation globale.
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Vérifier les opérations asynchrones, courses entre onglets, cycle de vie
        xterm, désabonnements, mémoire bornée et validation des données IPC.
        Préserver la sélection, le presse-papiers et la saisie du terminal.
        Comparer les préférences par valeur, indépendamment de l'ordre des clés
        JSON, et vérifier leur réouverture sans perte de profils ni réglages.
        Garder le curseur et l'écran synchronisés avec ConPTY ; un effacement
        local ne doit pas les déplacer indépendamment du pseudoterminal.
        Le collage confirmé doit envoyer uniquement le texte modifié à la même
        session, sans contourner la lecture seule ni les limites de taille.
        Le monitoring suit l'onglet actif sans cumuler les timers ou collectes.
        Signaler les régressions et proposer des tests ciblés sur le comportement.
    - path: "{index.html,src/**/*.css}"
      instructions: |
        Vérifier le focus clavier et les menus contextuels utiles, les thèmes
        clair/sombre, les barres de défilement et la dernière ligne du terminal.
        Préserver le dimensionnement en fenêtre normale ou agrandie et lors d'un
        changement de moniteur ou de DPI, sans masquer le prompt ni les contrôles.
    - path: "src-tauri/src/**/*.sh"
      instructions: |
        Les collectes de monitoring restent finies, sans écriture dans Linux ni
        changement de configuration. Vérifier les compteurs absents, remises à
        zéro et formats de sortie sans déclencher une distribution arrêtée.
    - path: "src-tauri/tests/**/*.rs"
      instructions: |
        Vérifier la conservation des préférences à travers des processus distincts
        et l'isolation des données de test des installations réelles de l'utilisateur.
    - path: "src/locales/*.json"
      instructions: |
        Maintenir la parité des clés français/anglais et des interpolations.
        Les sorties du terminal doivent rester du texte, sans injection HTML.
    - path: "src-tauri/capabilities/**"
      instructions: |
        Examiner toute extension des permissions Tauri. Ne pas ajouter de droit
        shell ou réseau générique si une commande native validée suffit.
    - path: "installer/**"
      instructions: |
        Vérifier l'encodage UTF-8, les chemins NSIS sous Windows, les installations
        et mises à jour sans perte de préférences, la fermeture sans arrêt forcé,
        le mode portable et la suppression limitée aux fichiers appartenant à DooTTY.
    - path: "scripts/**"
      instructions: |
        Vérifier la portabilité Windows/WSL, les erreurs de processus et les
        contrôles des binaires et licences. Les artefacts publics ne doivent pas
        inclure de chemins personnels, secrets ou fichiers privés de .local.
    - path: ".github/workflows/**"
      instructions: |
        Vérifier les permissions minimales, les actions épinglées et l'isolation
        des builds de PR vis-à-vis des secrets et publications de releases.
        Ne jamais exécuter le code d'une PR non fiable avec un jeton privilégié.
