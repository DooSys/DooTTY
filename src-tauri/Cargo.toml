[package]
name = "dootty"
version = "0.0.5"
description = "Your native WSL client."
license = "MIT"
authors = ["DooSys"]
homepage = "https://github.com/DooSys"
edition = "2021"
rust-version = "1.99"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "DooTTY"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
arboard = { version = "3", default-features = false }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Networking_WinHttp", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Environment"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
