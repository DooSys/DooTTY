name: Windows build and checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Verify Rust MSVC toolchain
        run: rustup show
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run check:public
      - run: npm audit --audit-level=moderate
      - run: npm run check:translations
      - run: npm test
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build DooTTY.exe
        run: npm run build:windows
      - name: Package executable and licenses
        run: python scripts/package-test.py --binary src-tauri/target/release/DooTTY.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DooTTY-Windows-x64
          path: .local/releases/*/DooTTY-*-windows-x64.zip
          # The explicit ZIP glob is intentional; never upload the whole .local directory.
          include-hidden-files: true
          if-no-files-found: error
